spring:
  application:
    name: AgroAPI-Logacho
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
server:
  port: 8080
agro:
  jwt:
    secret: ${AGRO_JWT_SECRET:}
  datasource:
    url: jdbc:h2:file:./data/agroapi-local;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
